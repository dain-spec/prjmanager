<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920" />
<title>업무 현황</title>
<meta name="description" content="서비스별 Figma·XD 파일 현황과 부서 업무 요청 진행 현황을 한 화면에서 관리하는 팀 내부용 사이트" />
<link rel="icon" type="image/svg+xml" href="src/favicon.svg?v=f18387f6" />
<link rel="stylesheet" href="src/tokens.css?v=cc6bd91d" />
<link rel="stylesheet" href="src/styles.css?v=fde6f2a5" />
</head>
<body>
<a class="skip-link" href="#content">본문으로 건너뛰기</a>

<div class="app">
  <!-- ── 헤더 ───────────────────────────────────────────── -->
  <header class="page-head">
    <!-- 제목은 탭과 무관하게 고정이다. 지금 보고 있는 표는 바로 옆 탭이 알려 준다. -->
    <div class="page-head__lead">
      <div class="page-head__titles">
        <h1 class="page-head__title">업무 현황</h1>
      </div>

      <!-- 표 두 개(파일 현황 · 업무 요청)를 오가는 탭 -->
      <nav class="tabs" id="tabs" role="tablist" aria-label="현황 종류">
        <button type="button" class="tab" role="tab" data-view="works" aria-selected="true">파일 현황</button>
        <button type="button" class="tab" role="tab" data-view="requests" aria-selected="false">업무 요청</button>
      </nav>
    </div>

    <div class="page-head__actions">
      <!-- 선택 상태 -->
      <p class="page-head__selection" id="selection-count" hidden>0개 선택</p>
      <button type="button" class="btn btn--danger-ghost" id="btn-delete-selected" hidden>삭제</button>

      <!-- 편집 상태 -->
      <button type="button" class="btn btn--primary" id="btn-save" hidden>저장</button>
      <button type="button" class="btn btn--ghost" id="btn-cancel" hidden>취소</button>

      <!-- CSV 내보내기는 추후 제공 예정. hidden 만 제거하면 다시 노출된다. -->
      <button type="button" class="btn btn--secondary" id="btn-export" hidden>CSV 내보내기</button>

      <!-- 기간 보기 — 업무 요청 탭에서만 쓴다. 요청일이 고른 기간에 든 행만 남긴다. -->
      <div class="period" id="period" hidden>
        <div class="period__units" role="group" aria-label="기간 단위">
          <button type="button" class="period__unit" data-unit="all" aria-pressed="true">전체</button>
          <button type="button" class="period__unit" data-unit="week" aria-pressed="false">주</button>
          <button type="button" class="period__unit" data-unit="month" aria-pressed="false">월</button>
        </div>

        <!-- 전체를 보고 있을 때는 오갈 기간이 없으므로 숨긴다. -->
        <div class="period__nav" id="period-nav" hidden>
          <button type="button" class="btn btn--ghost btn--icon" data-step="-1" aria-label="이전 기간">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
          </button>
          <span class="period__label" id="period-label" aria-live="polite"></span>
          <button type="button" class="btn btn--ghost btn--icon" data-step="1" aria-label="다음 기간">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
          </button>
        </div>
      </div>

      <!-- 평소엔 버튼만 보이고, 누르면 입력칸이 펼쳐진다. -->
      <div class="search" id="search-box">
        <input type="search" id="search" class="search__input"
               placeholder="검색" aria-label="목록 검색" hidden />
        <button type="button" class="btn btn--ghost btn--icon" id="btn-search"
                aria-label="검색" aria-expanded="false" title="검색">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6" /><path d="M10.4 10.4 14 14" />
          </svg>
        </button>
      </div>

      <button type="button" class="btn btn--ghost btn--icon" id="btn-theme" aria-label="라이트/다크 모드 전환" title="라이트 / 다크 모드 전환">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3.1" />
          <path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.05 3.05l1.13 1.13M11.82 11.82l1.13 1.13M12.95 3.05l-1.13 1.13M4.18 11.82l-1.13 1.13" />
        </svg>
      </button>
    </div>
  </header>

  <main class="content" id="content">
    <!-- ── 요약 통계 ─────────────────────────────────────── -->
    <!-- 대시보드는 추후 제공 예정. JS 가 항상 hidden 으로 둔다. -->
    <section class="stats" id="stats" aria-label="현황 요약" hidden>
      <article class="stat stat--total">
        <p class="stat__label">전체 서비스 수</p>
        <div class="stat__body">
          <strong class="stat__value" id="stat-total">0</strong>
          <span class="stat__aside" id="stat-total-aside">메뉴 0건</span>
        </div>
      </article>

      <article class="stat stat--figma">
        <p class="stat__label">Figma 서비스 수</p>
        <div class="stat__body">
          <strong class="stat__value" id="stat-figma">0</strong>
          <span class="badge badge--neutral" id="stat-figma-pct">0%</span>
        </div>
      </article>

      <article class="stat stat--xd">
        <p class="stat__label">XD 서비스 수</p>
        <div class="stat__body">
          <strong class="stat__value" id="stat-xd">0</strong>
          <span class="badge badge--neutral" id="stat-xd-pct">0%</span>
        </div>
      </article>

      <article class="stat stat--rate">
        <p class="stat__label">WHDS 적용률</p>
        <div class="stat__body">
          <strong class="stat__value" id="stat-rate">0%</strong>
          <div class="meter" role="img" aria-labelledby="stat-rate">
            <div class="meter__fill" id="stat-rate-bar" style="width:0%"></div>
          </div>
        </div>
        <p class="stat__foot" id="stat-rate-foot">적용 0 / 대상 0</p>
      </article>
    </section>

    <!-- ── 현황 테이블 ───────────────────────────────────── -->
    <section class="panel" aria-label="현황 목록">
      <div class="table-wrap" tabindex="0">
        <!-- 컬럼 구성은 탭마다 다르므로 colgroup 과 thead 는 JS(VIEWS)가 만든다. -->
        <table class="table">
          <colgroup></colgroup>
          <thead><tr></tr></thead>
          <tbody id="tbody"></tbody>
        </table>

        <!-- 데이터가 아예 없으면 hover · 우클릭으로 행을 넣을 대상이 없다.
             그 경우에만 여기서 추가 버튼을 내보낸다. 문구는 JS 가 정한다. -->
        <div class="empty" id="empty" hidden>
          <p class="empty__text" id="empty-text"></p>
          <button type="button" class="btn btn--primary" data-action="add" id="btn-add-first" hidden>
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" /></svg>
            첫 항목 추가
          </button>
        </div>
      </div>
    </section>
  </main>
</div>


<!-- hover 한 행 왼쪽(표 바깥)에 따라다니는 행 추가 버튼.
     셀 안에 두면 .panel 의 overflow: hidden 에 잘리므로 body 레벨에 둔다. -->
<button type="button" class="row-insert" id="row-insert" title="아래에 행 추가" aria-label="아래에 행 추가" hidden>+</button>

<!-- 입력 자동완성. 항목은 JS 가 채운다.
     menu   — 같은 서비스에서 이미 쓴 메뉴명
     service — 파일 현황에 등록된 서비스명(이름이 맞아야 값이 연결된다) -->
<datalist id="menu-options"></datalist>
<datalist id="service-options"></datalist>

<!-- 담당자 복수 선택 팝업. 항목은 조직도(OWNER_GROUPS)에서 JS 가 만든다. -->
<div class="menu menu--picker" id="owner-picker" role="dialog" aria-label="담당자 선택" hidden></div>

<!-- 행 우클릭 메뉴. .panel 은 overflow: hidden 이라 잘리므로 body 레벨에 둔다. -->
<div class="menu" id="row-menu" role="menu" hidden>
  <button type="button" class="menu__item" role="menuitem" data-menu="insert-below" id="menu-insert">아래에 행 추가</button>
  <div class="menu__divider" id="menu-divider"></div>
  <button type="button" class="menu__item menu__item--danger" role="menuitem" data-menu="delete">삭제</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="src/app.js?v=064a7061"></script>
</body>
</html>
