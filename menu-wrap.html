<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MenuWrap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Noto Sans KR", "Noto Sans CJK KR", -apple-system, sans-serif;
    background: #f2f3f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .menu-wrap {
    width: 186px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .menu-item {
    width: 186px;
    height: 36px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    background: #ffffff;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .menu-item:hover {
    background: #f5f6f8;
  }

  .menu-icon {
    width: 18px;
    height: 18px;
    margin-right: 6px;
    flex-shrink: 0;
  }

  .menu-title {
    font-size: 14px;
    font-weight: 500;
    color: #333333;
    letter-spacing: -0.5px;
    line-height: 21px;
  }
</style>
</head>
<body>

<div class="menu-wrap">

  <!-- 재무회계 : calculator icon -->
  <div class="menu-item">
    <svg class="menu-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <rect width="18" height="18" rx="3.5" fill="#5f6879"/>
      <rect x="5.5" y="4.9" width="1.27" height="4.75" rx="0.6" fill="#ffffff"/>
      <rect x="3.5" y="6.5" width="4.75" height="1.27" rx="0.6" fill="#ffffff"/>
      <rect x="9" y="11" width="9" height="9" rx="0" fill="#02b36d" clip-path="inset(0 0 1px 0 round 0 0 3.5px 0)"/>
      <rect x="9" y="11" width="9" height="9" fill="#02b36d"/>
      <rect x="4" y="13.9" width="4.75" height="1.27" rx="0.6" fill="#ffffff"/>
      <rect x="4" y="6.9" width="4.75" height="1.27" rx="0.6" fill="#ffffff"/>
      <rect x="11.9" y="13.9" width="4.75" height="1.27" rx="0.6" fill="#ffffff"/>
      <rect x="11.9" y="16" width="4.75" height="1.27" rx="0.6" fill="#ffffff"/>
    </svg>
    <span class="menu-title">재무회계</span>
  </div>

  <!-- 자동전표 : doc/state(chart) icon -->
  <div class="menu-item">
    <svg class="menu-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <rect width="13.5" height="13.5" rx="3.5" fill="#79c3f7"/>
      <rect x="1.75" y="1.5" width="15" height="1.5" rx="0.5" fill="#45a7ee"/>
      <rect x="1.75" y="7" width="15" height="1.5" rx="0.5" fill="#45a7ee"/>
      <rect x="5.5" y="1.5" width="1.5" height="11.5" rx="0.5" fill="#45a7ee"/>
      <rect x="12.5" y="-2.5" width="1.5" height="5.5" rx="0.5" fill="#45a7ee" transform="translate(0,5.5)"/>
      <circle cx="11" cy="13.5" r="4.5" fill="#0065a9"/>
    </svg>
    <span class="menu-title">자동전표</span>
  </div>

  <!-- 부가가치세 : money pouch icon -->
  <div class="menu-item">
    <svg class="menu-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="3" r="1" fill="#21d4a8"/>
      <path d="M9 3.2c-1.9 1.7-4.2 3.4-4.2 6.4a4.2 4.2 0 0 0 8.4 0c0-3-2.3-4.7-4.2-6.4z" fill="#21d4a8"/>
      <path d="M7.3 9.3c.5.4.9 1 1.2 1.7.4-.7.9-1.3 1.5-1.7" stroke="#ffffff" stroke-width="1.1"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="menu-title">부가가치세</span>
  </div>

  <!-- 고정자산/자금예산 : building icon -->
  <div class="menu-item">
    <svg class="menu-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <rect x="2.8" y="5" width="7.2" height="11" rx="0.8" fill="#a8b6c9"/>
      <rect x="8" y="2" width="7" height="14" rx="0.8" fill="#667b97"/>
      <rect x="9.5" y="4" width="1.4" height="1.4" fill="#ffffff"/>
      <rect x="12" y="4" width="1.4" height="1.4" fill="#ffffff"/>
      <rect x="9.5" y="7" width="1.4" height="1.4" fill="#ffffff"/>
      <rect x="12" y="7" width="1.4" height="1.4" fill="#ffffff"/>
      <rect x="9.5" y="10" width="1.4" height="1.4" fill="#ffffff"/>
      <rect x="12" y="10" width="1.4" height="1.4" fill="#ffffff"/>
      <rect x="4" y="7" width="1.4" height="1.4" fill="#ffffff"/>
      <rect x="4" y="10" width="1.4" height="1.4" fill="#ffffff"/>
      <rect x="4" y="13" width="1.4" height="1.4" fill="#ffffff"/>
      <rect x="10.5" y="13" width="3" height="3" fill="#667b97"/>
    </svg>
    <span class="menu-title">고정자산/자금예산</span>
  </div>

  <!-- 기초데이터 : document search icon -->
  <div class="menu-item">
    <svg class="menu-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <rect width="18" height="18" rx="3.5" fill="#d7dded"/>
      <rect x="6" y="7" width="9" height="2" rx="1" fill="#828794"/>
      <rect x="6" y="11" width="5.5" height="2" rx="1" fill="#828794"/>
      <rect x="6" y="15" width="3" height="2" rx="1" fill="#828794"/>
      <circle cx="11" cy="11" r="4" fill="#0a0000"/>
      <circle cx="11" cy="11" r="2.7" fill="#ffffff"/>
      <rect x="14.5" y="13.5" width="2.2" height="2.2" rx="0.5" fill="#0a0000" transform="rotate(45 15.6 14.6)"/>
    </svg>
    <span class="menu-title">기초데이터</span>
  </div>

</div>

</body>
</html>
